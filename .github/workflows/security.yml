name: security

# Release gate de seguridad en CI. Detecta automáticamente el stack del proyecto
# y ejecuta los scanners correspondientes:
# - Python: bandit (SAST) + pip-audit (dependencias) + detect-secrets.
# - JS/TS: npm audit.
# Complementa a /8-auditar que se ejecuta manualmente durante el desarrollo.
# Si alguno falla, el PR se bloquea hasta resolver o documentar la excepción
# en docs/security/.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detectar stack
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      node: ${{ steps.check.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar pyproject.toml / requirements.txt / package.json
        id: check
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f Pipfile ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  python-sast:
    name: Python SAST (bandit)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        # -ll = medium+ severity; -i = include confidence filter.
        # Falla el CI si hay findings medium+ no suprimidos en pyproject.toml.
        run: bandit -r src/ -ll -i -f txt

  python-deps:
    name: Python dependency scan (pip-audit)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pip-audit
        # Audit the environment uv actually builds, not a requirements file.
        # `pip-audit -r` resolves every pin against PyPI, and this project pins
        # torch==2.13.0+cpu from the PyTorch index - a version PyPI has never
        # heard of, so the resolve fails before a single CVE is checked.
        # Verified locally on 2026-09-08: -r fails, auditing the environment works.
        #
        # Every optional group is synced, not just `security`. `uv sync` prunes what
        # the named groups do not ask for, so auditing with `--group security` alone
        # would leave the `labeling` dependencies - the ones that actually open a
        # network connection - out of the environment being scanned. `phase7` joined
        # them when the local extractors arrived: they download models and load
        # weights, which is exactly the surface a dependency scan is for.
        run: |
          if [ -f uv.lock ]; then
            pip install uv
            uv sync --group security --group labeling --group phase7
            uv run pip-audit --desc
          elif [ -f requirements.txt ]; then
            pip install pip-audit
            pip-audit -r requirements.txt --desc
          else
            pip install pip-audit
            pip install -e . && pip-audit --desc
          fi

  python-secrets:
    name: Secret scanning (detect-secrets)
    needs: detect
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan for secrets
        # `detect-secrets scan` exits 0 whatever it finds, so it cannot gate anything.
        # `detect-secrets-hook` does exit non-zero, and honours the baseline: the 23
        # audited findings (corpus hashes, the resolved model commit, a HotpotQA id)
        # stay quiet, while anything new fails the job.
        #
        # Regenerate the baseline deliberately, never to silence a failure:
        #   uv run detect-secrets scan $(git ls-files --cached --others --exclude-standard) \
        #     > .secrets.baseline
        # then read every entry before committing it. `--others --exclude-standard` adds
        # the files staged for this change but not yet committed, which plain `git ls-files`
        # would leave unscanned. Regenerating on Windows keys the results with backslashes
        # and this job runs on ubuntu, so normalise them to forward slashes or the hook
        # reads its own audited findings as new ones.
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
          else
            echo "[ERROR] no .secrets.baseline: create one and audit it" >&2
            exit 1
          fi

  node-deps:
    name: Node dependency scan (npm audit)
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Run npm audit
        # Falla el CI si hay vulnerabilidades de nivel high+.
        run: npm audit --audit-level=high
