[project]
name = "concept-embeddings-rag"
version = "0.1.0"
description = "Retrieval experiment over a corpus-induced concept space with query-aware iterative expansion"
readme = "README.md"
authors = [
    { name = "mikelju", email = "mikelju@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch==2.13.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "bm25s>=0.3.11",
]

[project.scripts]
cer = "concept_embeddings_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
labeling = [
    "anthropic>=1.4.0",
    "python-dotenv>=1.2.3",
]
phase7 = [
    "en-core-web-sm",
    "gliner==0.2.29",
    "protobuf>=4.25",
    "spacy==3.8.16",
]
# Deviation 17.1 (J-decision, CLM-8B): synced on the rented Linux x86_64 pod only, never on the laptop.
pod = [
    "contrastive-lm==0.1.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vllm>=0.6 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Declared so that `tool.uv.sources` can route them to the cu126 index (vllm's own pins).
    "torchvision==0.28.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
security = [
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
]

# torch publishes no win_arm64 wheels on PyPI; the official PyTorch index does.
# Read the gotchas section of CLAUDE.md before touching this.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
# pip-audit on CI (PR 28) flagged urllib3 2.7.0 (CVE-2026-97687/97688/97689): a patched
# floor only. setuptools 80.10.2 (PYSEC-2026-3447, sdist building on macOS) cannot be raised
# while vllm pins setuptools<81; CI ignores that one id, see .github/workflows/security.yml.
constraint-dependencies = ["urllib3>=2.8.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
# vllm 0.30.0 (group `pod`) pulls torchvision and torchaudio from PyPI, built for CUDA 13;
# torchvision refuses to import next to torch cu126 (Phase 17 pod, 2026-10-01). Same index
# as torch on the pod platform; nothing resolves them elsewhere.
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Third-party skill scripts and artifacts: not project code.
exclude = [".claude", ".tmp", "data", ".venv"]

[tool.ruff.lint]
# S is the flake8-bandit port: SAST in the local loop, not only in CI.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Asserts are how pytest expresses every expectation; S101 there is pure noise.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
