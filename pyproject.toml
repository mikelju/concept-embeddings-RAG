[project]
name = "concept-embeddings-rag"
version = "0.1.0"
description = "Retrieval experiment over a corpus-induced concept space with query-aware iterative expansion"
readme = "README.md"
authors = [
    { name = "mikelju", email = "mikelju@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.13",
    "httpx>=0.27",
    "tqdm>=4.66",
    "bm25s>=0.3.11",
]

[project.scripts]
cer = "concept_embeddings_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
labeling = [
    "anthropic>=1.4.0",
    "python-dotenv>=1.2.3",
]
phase7 = [
    "en-core-web-sm",
    "gliner==0.2.29",
    "protobuf>=4.25",
    "spacy==3.8.16",
]
security = [
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
]

# torch publishes no win_arm64 wheels on PyPI; the official PyTorch index does.
# Read the gotchas section of CLAUDE.md before touching this.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Third-party skill scripts and artifacts: not project code.
exclude = [".claude", ".tmp", "data", ".venv"]

[tool.ruff.lint]
# S is the flake8-bandit port: SAST in the local loop, not only in CI.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Asserts are how pytest expresses every expectation; S101 there is pure noise.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
